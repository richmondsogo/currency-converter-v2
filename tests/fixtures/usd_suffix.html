<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Plug.tech Fixture - USD Suffix & Strike Prices</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .product { margin-bottom: 25px; }
    .current-price { font-size: 24px; font-weight: bold; color: #111; }
    .compare-price { text-decoration: line-through; color: #777; margin-left: 10px; }
    .installments { color: #333; font-size: 14px; margin-top: 5px; }
    .filter-box { margin-top: 30px; padding: 15px; border: 1px solid #ddd; }
  </style>
</head>
<body>
  <h1>Certified Pre-Owned iPhones</h1>

  <div class="product">
    <h2>iPhone 13 - 128GB - Midnight</h2>
    <span class="current-price">$399.00 USD</span>
    <span class="compare-price">$1,107.92 USD</span>
    <div class="installments">or as low as $24.73/mo with Affirm</div>
  </div>

  <div class="product">
    <h2>iPhone 12 - 64GB - Blue</h2>
    <span class="current-price">$289.00 USD</span>
    <span class="compare-price">$799.00 USD</span>
    <div class="installments">or as low as $18.50/mo with Klarna</div>
  </div>

  <div class="product">
    <h2>Accessories & Cables</h2>
    <div class="case-us-compact">Case: <span class="test-price-1">US$25</span></div>
    <div class="case-usd-prefix">Charger: <span class="test-price-2">USD 25</span></div>
    <div class="case-usd-suffix">Cable: <span class="test-price-3">$25 USD</span></div>
  </div>

  <div class="filter-box">
    <h3>Price Filter</h3>
    <label>From $ <input type="text" placeholder="Min" /> To $ <input type="text" placeholder="Max" /></label>
  </div>
</body>
</html>
