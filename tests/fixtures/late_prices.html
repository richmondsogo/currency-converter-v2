<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Late Rendered Prices Fixture</title>
</head>
<body>
  <h1>Product Showcase</h1>
  <div id="price-container">
    <!-- Prices inserted asynchronously by client-side script 1500ms after load -->
    <p class="loading">Loading prices...</p>
  </div>

  <script>
    setTimeout(() => {
      const container = document.getElementById('price-container');
      container.innerHTML = '';
      const priceEl = document.createElement('div');
      priceEl.id = 'late-price';
      priceEl.textContent = '$120.00 USD';
      container.appendChild(priceEl);
    }, 1500);
  </script>
</body>
</html>
